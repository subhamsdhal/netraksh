# NETRAKSH — Render Blueprint.
# Deploys the backend/control plane only via backend/Dockerfile. Edge AI runs
# on camera-side compute; the frontend is a separate static deployment.
# See docs/DEPLOYMENT.md for the full walkthrough.
#
# SECRET_KEY, ADMIN_PASSWORD, DATABASE_URL, and EDGE_AUTH_TOKEN are never
# hardcoded in source control. Render generates the application secrets and
# receives DATABASE_URL from the externally managed PostgreSQL service.
services:
  - type: web
    name: netraksh
    branch: main
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: INITIAL_OPERATOR_PASSWORD
        generateValue: true
      - key: INITIAL_AUDITOR_PASSWORD
        generateValue: true
      - key: COMMAND_ID
        value: COMMAND_A
      - key: DATABASE_URL
        # Supply the external Supabase Session Pooler URL in Render's
        # dashboard; credentials are never committed here.
        sync: false
      - key: EDGE_AUTH_TOKEN
        # Render generates the shared edge authentication secret.
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://netraksh.vercel.app,https://netraksh-35030.web.app"
      - key: FRONTEND_ORIGIN
        value: "https://netraksh-35030.web.app"
      - key: ENV
        value: "production"
