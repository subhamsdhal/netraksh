# NETRAKSH — Render Blueprint.
# Deploys the backend/control plane plus two isolated cloud edge workers.
# The frontend remains a separate Vercel deployment.
# See docs/DEPLOYMENT.md for the full walkthrough.
#
# SECRET_KEY, ADMIN_PASSWORD, and DATABASE_URL are never committed to
# source control.
#
# FIRST-TIME SETUP (after rotating the Supabase password):
#   1. In the Render dashboard → service → Environment tab, add:
#        DATABASE_URL = postgresql://<user>:<rotated-password>@<host>/<db>
#   2. All other secrets (SECRET_KEY, ADMIN_PASSWORD, INITIAL_OPERATOR_PASSWORD,
#      INITIAL_AUDITOR_PASSWORD) are auto-generated by Render at deploy time.
#   3. Retrieve ADMIN_PASSWORD from the Render dashboard after first deploy.
#
# SECURITY NOTE:
#   DATABASE_URL must ONLY be set through the Render dashboard's secret
#   environment management — never hardcoded here. The credential that was
#   previously hardcoded in this file has been revoked; see the security
#   incident log for remediation details.
services:
  - type: web
    name: netraksh
    branch: main
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: INITIAL_OPERATOR_PASSWORD
        generateValue: true
      - key: INITIAL_AUDITOR_PASSWORD
        generateValue: true
      - key: COMMAND_ID
        value: COMMAND_A
      - key: DATABASE_URL
        # REQUIRED: Set this in the Render dashboard → Environment tab.
        # Never hardcode here. Rotate via Supabase dashboard, then update Render.
        # Format: postgresql://<user>:<password>@<host>:<port>/<database>
        sync: false
      - key: EDGE_AUTH_TOKEN
        # Required when mTLS is not mandatory. Set the same secret on each
        # separately deployed edge device; never commit it.
        sync: false
      - key: OBJECT_STORAGE_PROVIDER
        value: s3
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: OBJECT_STORAGE_REGION
        sync: false
      - key: CORS_ORIGINS
        value: "https://netraksh.vercel.app,https://netraksh-35030.web.app"
      - key: FRONTEND_ORIGIN
        value: "https://netraksh-35030.web.app"
      - key: ENV
        value: "production"
      - key: EDGE_WAKE_URL_CAM_BORDER_01
        value: https://netraksh-edge-camera-1.onrender.com
      - key: EDGE_WAKE_URL_CAM_CHECKPOINT_01
        value: https://netraksh-edge-camera-2.onrender.com

  - type: web
    name: netraksh-edge-camera-1
    branch: main
    runtime: docker
    dockerfilePath: ./edge/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BACKEND_URL
        value: https://netraksh.onrender.com
      - key: EDGE_AUTH_TOKEN
        fromService:
          type: web
          name: netraksh
          envVarKey: EDGE_AUTH_TOKEN
      - key: CAMERA_ID
        value: cam-border-01
      - key: VIDEO_SOURCE
        value: demo/videos/uploaded_demo.mp4
      - key: DEMO_LOOP_VIDEO
        value: "true"
      - key: DETECTOR_RUNTIME
        value: onnx_cpu
      - key: DETECTOR_MODEL_ONNX
        value: /app/yolov8n.onnx
      - key: EDGE_CONSTRAINED_CLOUD
        value: "true"
      - key: ANPR_OCR_BACKEND
        value: disabled
      - key: SYNC_INTERVAL_SECONDS
        value: "2"
      - key: EDGE_ALLOW_KEY_GENERATION
        value: "true"
      - key: EDGE_RUNTIME_DIR
        value: /tmp/netraksh-edge
      - key: EDGE_SOURCE_CACHE_DIR
        value: /tmp/netraksh-edge/sources
      - key: EDGE_KEY_DIR
        value: /tmp/netraksh-edge/keys

  - type: web
    name: netraksh-edge-camera-2
    branch: main
    runtime: docker
    dockerfilePath: ./edge/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BACKEND_URL
        value: https://netraksh.onrender.com
      - key: EDGE_AUTH_TOKEN
        fromService:
          type: web
          name: netraksh
          envVarKey: EDGE_AUTH_TOKEN
      - key: CAMERA_ID
        value: cam-checkpoint-01
      - key: VIDEO_SOURCE
        value: demo/videos/uploaded_demo.mp4
      - key: DEMO_LOOP_VIDEO
        value: "true"
      - key: DETECTOR_RUNTIME
        value: onnx_cpu
      - key: DETECTOR_MODEL_ONNX
        value: /app/yolov8n.onnx
      - key: EDGE_CONSTRAINED_CLOUD
        value: "true"
      - key: ANPR_OCR_BACKEND
        value: disabled
      - key: SYNC_INTERVAL_SECONDS
        value: "2"
      - key: EDGE_ALLOW_KEY_GENERATION
        value: "true"
      - key: EDGE_RUNTIME_DIR
        value: /tmp/netraksh-edge
      - key: EDGE_SOURCE_CACHE_DIR
        value: /tmp/netraksh-edge/sources
      - key: EDGE_KEY_DIR
        value: /tmp/netraksh-edge/keys
